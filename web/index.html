<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Processor</title>
  <link rel="icon" type="image/png" href="./img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Exo+2:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-zinc-950 text-zinc-100 antialiased grain">

  <div class="pointer-events-none fixed inset-0 -z-10 scanlines"></div>
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-32 -right-32 h-[28rem] w-[28rem] rounded-full bg-emerald-500/15 blur-3xl"></div>
    <div class="absolute bottom-0 -left-32 h-[26rem] w-[26rem] rounded-full bg-emerald-400/10 blur-3xl"></div>
  </div>

  <header class="max-w-7xl mx-auto px-6 pt-12 pb-8">
    <p class="display text-xs uppercase tracking-[0.3em] text-emerald-400 glow-emerald">Image Processor</p>
    <h1 class="display mt-3 text-3xl font-bold tracking-tight text-zinc-100 glow-emerald">Обработка изображений</h1>
    <p class="mt-3 text-sm text-zinc-500">Индустриальная обработка · в памяти, без сохранения</p>
  </header>

  <main class="flex-1 max-w-7xl mx-auto px-4 py-6 w-full" x-data="imageApp()" x-cloak>
    <div class="grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_340px] gap-6 lg:items-start">

      <div class="flex flex-col gap-6">

        <section
          @dragover.prevent="dragging = true"
          @dragleave.prevent="dragging = false"
          @drop.prevent="dragging = false; addFiles($event.dataTransfer.files)"
          class="rounded-lg border bg-zinc-900/50 backdrop-blur-xl p-4 transition-all"
          :class="dragging ? 'border-emerald-400/60 bg-emerald-500/10 shadow-[0_0_30px_rgba(52,211,153,0.25)]' : 'border-zinc-800'"
        >
          <div class="flex items-center justify-between gap-3 mb-3">
            <div>
              <h2 class="display text-sm text-emerald-300 glow-emerald">Файлы <span class="text-emerald-400/60" x-show="files.length" x-text="'(' + files.length + ')'"></span></h2>
              <p class="text-[11px] text-zinc-500 mt-0.5" x-show="!files.length">Перетащите файлы сюда</p>
            </div>
            <button type="button" @click="$refs.fileInput.click()"
              class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg border border-emerald-500/40 bg-emerald-500/10 text-sm text-zinc-200 hover:border-emerald-400 hover:text-emerald-300 hover:shadow-[0_0_16px_rgba(52,211,153,0.4)] transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
              </svg>
              Загрузить
            </button>
            <input type="file" x-ref="fileInput" multiple accept=".jpg,.jpeg,.png,image/jpeg,image/png" class="hidden" @change="addFiles($event.target.files)" />
          </div>

          <template x-if="files.length">
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
              <template x-for="(item, index) in files" :key="index">
                <div class="relative rounded-md border border-zinc-800 overflow-hidden bg-black/30">
                  <img :src="item.url" class="h-20 w-full object-cover" />
                  <button type="button" @click="removeFile(index)" class="absolute top-1.5 right-1.5 h-5 w-5 rounded-full bg-black/60 text-zinc-100 text-xs leading-none flex items-center justify-center hover:bg-red-600 transition-colors">×</button>
                  <div class="px-2 py-1.5">
                    <p class="text-xs text-zinc-300 truncate" :title="item.file.name" x-text="item.file.name"></p>
                    <p class="text-[11px] text-zinc-500" x-text="formatSize(item.file.size)"></p>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="!files.length">
            <div class="rounded-md border border-dashed border-zinc-800 py-8 text-center text-sm text-zinc-600">
              JPEG, PNG · можно несколько
            </div>
          </template>
        </section>

        <section class="rounded-lg border border-zinc-800 bg-zinc-900/50 backdrop-blur-xl p-4">
          <h2 class="display text-sm text-emerald-300 glow-emerald mb-3">Результат</h2>

          <template x-if="error">
            <div class="rounded-md border border-red-500/50 bg-red-500/10 text-red-300 px-3 py-2.5 flex items-start justify-between gap-3 shadow-[0_0_18px_rgba(239,68,68,0.15)]">
              <span class="text-sm" x-text="error"></span>
              <button type="button" @click="error=''" class="text-red-400 hover:text-red-200 font-bold leading-none">×</button>
            </div>
          </template>

          <template x-if="resultUrl && !error">
            <div>
              <template x-if="resultIsImage">
                <img :src="resultUrl" class="max-h-80 rounded-md border border-zinc-800" />
              </template>
              <template x-if="!resultIsImage">
                <div class="rounded-md border border-zinc-800 bg-black/30 p-6 text-center text-zinc-500">Архив с результатами готов.</div>
              </template>
              <button type="button" @click="download()"
                class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-zinc-950 text-sm font-semibold shadow-[0_0_22px_rgba(52,211,153,0.4)] transition-all">
                Скачать <span class="font-normal opacity-80" x-text="resultName"></span>
              </button>
            </div>
          </template>

          <template x-if="!resultUrl && !error">
            <div class="rounded-md border border-dashed border-zinc-800 py-8 text-center text-sm text-zinc-600">
              Здесь появится результат
            </div>
          </template>
        </section>
      </div>

      <aside class="rounded-lg border border-zinc-800 bg-zinc-900/50 backdrop-blur-xl p-5 lg:sticky lg:top-6">
        <h2 class="display text-sm text-emerald-300 glow-emerald mb-4">Параметры</h2>
        <div class="space-y-5">
          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Ширина, px</label>
            <input type="number" min="1" x-model="width" placeholder="авто"
              class="w-full rounded-md border border-zinc-800 bg-zinc-900/60 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/40" />
          </div>
          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Высота, px</label>
            <input type="number" min="1" x-model="height" placeholder="авто"
              class="w-full rounded-md border border-zinc-800 bg-zinc-900/60 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500/40" />
          </div>

          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Режим</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" @click="mode='fit'"
                :class="mode==='fit' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 shadow-[0_0_12px_rgba(52,211,153,0.35)]' : 'bg-white/[0.03] border-zinc-800 text-zinc-400 hover:border-emerald-500/50'"
                class="px-2 py-2 rounded-md border text-sm font-medium transition-all">Fit</button>
              <button type="button" @click="mode='cover'"
                :class="mode==='cover' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 shadow-[0_0_12px_rgba(52,211,153,0.35)]' : 'bg-white/[0.03] border-zinc-800 text-zinc-400 hover:border-emerald-500/50'"
                class="px-2 py-2 rounded-md border text-sm font-medium transition-all">Cover</button>
              <button type="button" @click="mode='crop'"
                :class="mode==='crop' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 shadow-[0_0_12px_rgba(52,211,153,0.35)]' : 'bg-white/[0.03] border-zinc-800 text-zinc-400 hover:border-emerald-500/50'"
                class="px-2 py-2 rounded-md border text-sm font-medium transition-all">Crop</button>
            </div>
            <p class="mt-2 text-xs text-zinc-500" x-text="modeHint"></p>
          </div>

          <div>
            <label class="block text-sm text-zinc-400 mb-1.5">Формат</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" @click="format='jpeg'"
                :class="format==='jpeg' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 shadow-[0_0_12px_rgba(52,211,153,0.35)]' : 'bg-white/[0.03] border-zinc-800 text-zinc-400 hover:border-emerald-500/50'"
                class="px-3 py-2 rounded-md border text-sm font-medium transition-all">JPEG</button>
              <button type="button" @click="format='webp'"
                :class="format==='webp' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 shadow-[0_0_12px_rgba(52,211,153,0.35)]' : 'bg-white/[0.03] border-zinc-800 text-zinc-400 hover:border-emerald-500/50'"
                class="px-3 py-2 rounded-md border text-sm font-medium transition-all">WebP</button>
              <button type="button" @click="format='png'"
                :class="format==='png' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/40 shadow-[0_0_12px_rgba(52,211,153,0.35)]' : 'bg-white/[0.03] border-zinc-800 text-zinc-400 hover:border-emerald-500/50'"
                class="px-3 py-2 rounded-md border text-sm font-medium transition-all">PNG</button>
            </div>
          </div>

          <div>
            <label class="flex items-center justify-between text-sm text-zinc-400 mb-1.5">
              <span>Ка</span>чество</span>
              <span class="text-emerald-400 glow-emerald font-semibold" x-text="quality"></span>
            </label>
            <input type="range" min="1" max="100" x-model.number="quality"
              class="w-full h-2 bg-zinc-800 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
          </div>
        </div>

        <button type="button" @click="process()" :disabled="!files.length || processing"
          class="mt-6 w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg font-semibold transition-all"
          :class="(!files.length || processing) ? 'bg-white/[0.05] text-zinc-500 cursor-not-allowed' : 'bg-emerald-500 text-zinc-950 hover:bg-emerald-400 shadow-[0_0_24px_rgba(52,211,153,0.45)]'">
          <svg x-show="processing" class="animate-spin h-4 w-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span x-text="processing ? 'Обработка…' : 'Обработать'"></span>
        </button>
      </aside>

    </div>
  </main>

  <footer class="max-w-7xl mx-auto px-4 pb-6 pt-2 text-center text-xs text-zinc-600">
    FastAPI + Pillow · изображения обрабатываются в памяти
  </footer>

</body>
</html>
